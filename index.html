<!DOCTYPE html>
<html>
<head>
  <title>Esperanza AI Postman</title>
  <style>
    html{background: darkred; color: }
    body { padding:20px ;font-family: sans-serif; margin: 15px; background: purple; color: #eee; border: 3px solid slategray; border-radius: 10px}

    img {position: absolute; top: 25px; left: 35px; max-width: 90px;  max-height: 90px;border-radius: 10px}
    h1{
      margin-left: 100px;
      color: black;
      text-shadow: -1px 0 darkgray, 0 1px darkgray, 1px 0 darkgray, 0 -1px darkgray;
    }
    input, textarea, select { width: 100%; margin-top: 5px; margin-bottom: 10px; background-color: beige; box-shadow: rgba(17, 17, 26, 0.05) 0px 1px 0px, rgba(17, 17, 26, 0.1) 0px 0px 8px;}
    textarea { height: 100px; }
    pre { background: beige; padding: 10px; overflow: auto; }
    button {
    padding: 10px;
    background: #1e88e5;
    border: 1px solid black;
    border-radius: 5px;
    color: black;
    cursor: pointer;
    transition: all 0.2s ease-in-out;
    box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.3);
  }

  button:active {
    background-color: #1565c0;
    transform: scale(0.98);
    box-shadow: 0px 1px 2px rgba(0, 0, 0, 0.5);
  }

  button.clicked {
    background-color: #43a047;
    box-shadow: 0 0 10px 2px limegreen;
    color: white;
  }
  pre{
    background-color: beige;
    color: black;
  }
  </style>
</head>
<body>
  <h1>Esperanza AI Postman</h1>
  <img src= "icons/icon.png"/>
  <label>Method:</label>
  <select id="method">
    <option>GET</option>
    <option>POST</option>
    <option>PUT</option>
    <option>DELETE</option>
  </select>

  <label>URL:</label>
  <input type="text" id="url" value="https://jsonplaceholder.typicode.com/posts">

  <label>Headers (JSON):</label>
  <textarea id="headers">{}</textarea>

  <label>Body (JSON):</label>
  <textarea id="body">{}</textarea>

  <button id="send-button">Send</button>
  <span style="color:orange;">Response:</span>
  <pre id="response">Waiting...</pre>

  <script src="renderer.js"></script>
</body>
</html>
